<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nivaaran · School sanitation accountability</title>
<meta name="description" content="Nivaaran prototype: report, assign, escalate and independently verify school sanitation problems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2545;--navy2:#13315c;--navy3:#1b3f70;--pri:#1d5fbf;--pri-d:#174ea0;--pri-s:#e8f0fc;
--bg:#f3f5f9;--card:#fff;--ink:#15233a;--mut:#5b6b82;--line:#e2e7ef;--line2:#cbd5e2;--soft:#f8fafc;
--ok:#16a34a;--ok-d:#15803d;--ok-s:#e7f6ec;--bad:#dc2626;--bad-d:#b91c1c;--bad-s:#fdecec;
--warn:#ea8a0c;--warn-d:#b45309;--warn-s:#fff3e3;--info:#2563eb;--info-d:#1d4ed8;--info-s:#e8f0fe;--muted-s:#eef1f5;
--r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);--sh2:0 12px 32px rgba(11,37,69,.18);--side:260px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.25}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.ic{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.sm{width:16px;height:16px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mut{color:var(--mut)}.sm{font-size:.85rem}
.txt-bad{color:var(--bad-d);font-weight:700}

/* ---------- sidebar ---------- */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side);background:var(--navy);color:#dbe5f3;display:flex;flex-direction:column;z-index:40;overflow-y:auto;transition:width .2s ease,transform .2s ease}
.brand{display:flex;align-items:center;gap:10px;padding:16px 12px 12px 14px}
.brand img{width:44px;height:44px;border-radius:10px;background:#fff;padding:2px;object-fit:contain;flex:0 0 auto}
.brand b{display:block;color:#fff;font-size:1.15rem;letter-spacing:.02em}
.brand small{display:block;color:#9fb3cf;font-size:.75rem;line-height:1.3}
.colbtn,.closebtn{margin-left:auto;background:transparent;border:0;color:#9fb3cf;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.colbtn:hover,.closebtn:hover{background:var(--navy2);color:#fff}
.closebtn{display:none}
.who{margin:4px 12px 10px;padding:12px;background:var(--navy2);border-radius:12px}
.who label{display:block;font-size:.72rem;color:#9fb3cf;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;font-weight:700}
.who select{width:100%;background:#fff;color:var(--ink);border:0;border-radius:8px;min-height:42px;padding:6px 8px}
.who p{margin:8px 0 0;font-size:.82rem;color:#c6d4e8;line-height:1.45}
.nav{list-style:none;margin:0;padding:4px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#c6d4e8;padding:10px 12px;border-radius:10px;min-height:46px;text-align:left;font-size:.95rem}
.nav button:hover{background:var(--navy2);color:#fff}
.nav button[aria-current=page]{background:var(--pri);color:#fff;font-weight:700}
.nav .cnt{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 8px;min-width:24px;text-align:center}
.nav .cnt.due{background:var(--warn)}
.demo{margin-top:auto;padding:14px 12px 16px;border-top:1px solid rgba(255,255,255,.08)}
.demo h4{margin:0 0 8px;font-size:.72rem;color:#9fb3cf;text-transform:uppercase;letter-spacing:.07em}
.dday{display:flex;align-items:center;gap:6px;font-size:.9rem;margin-bottom:8px;color:#e6eef9}
.demo .row{display:flex;gap:6px;margin-bottom:6px}
.dbtn{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--navy2);color:#e6eef9;border:1px solid rgba(255,255,255,.1);border-radius:8px;min-height:40px;padding:4px 8px;font-size:.85rem;white-space:nowrap}
.dbtn:hover{background:var(--navy3)}
.dbtn.danger{color:#fecaca}
.dbtn:disabled{opacity:.45;cursor:not-allowed}
.scrim{display:none}
.mainwrap{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column;transition:margin .2s ease}
@media (min-width:901px){
 body.col .side{width:76px}
 body.col .mainwrap{margin-left:76px}
 body.col .hide-col{display:none!important}
 body.col .brand{flex-direction:column;padding:14px 8px}
 body.col .colbtn{margin:0}
 body.col .colbtn .ic{transform:rotate(180deg)}
 body.col .nav{padding:4px 12px}
 body.col .nav button{justify-content:center;padding:10px}
 body.col .nav .lbl-t,body.col .nav .cnt{display:none}
}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;min-height:66px;flex-wrap:wrap}
.menu{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--ink);place-items:center}
.tt h2{margin:0;font-size:1.1rem}
.tt .crumb{color:var(--mut);font-size:.82rem}
.ctx{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctx select{border:1px solid var(--line2);border-radius:10px;min-height:42px;padding:6px 10px;background:#fff;color:var(--ink);max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;background:var(--muted-s);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--ok-s);color:var(--ok-d)}.chip.off{background:var(--warn-s);color:var(--warn-d)}

/* ---------- page ---------- */
main{padding:24px;max-width:1240px;width:100%;margin:0 auto;flex:1}
.page{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:1.6rem}
.ph h1:focus{outline:none}
.ph p{margin:4px 0 0;color:var(--mut);max-width:72ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px;min-width:0}
.ch{margin:0 0 12px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.ch .ic{color:var(--pri)}
.ch-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch-row .ch{margin:0}
.sec-t{font-size:1.15rem;margin:24px 0 12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-bottom:16px}
.g2>.card{margin:0}
.foot{display:flex;gap:8px;align-items:flex-start;color:var(--mut);font-size:.82rem;margin:28px 0 8px;padding-top:16px;border-top:1px solid var(--line)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.stat{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;color:inherit;text-align:left;width:100%;min-width:0}
button.stat{transition:border-color .15s,box-shadow .15s,transform .15s}
button.stat:hover{border-color:var(--pri);box-shadow:var(--sh2);transform:translateY(-1px)}
.si{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.s-ok .si{background:var(--ok-s);color:var(--ok-d)}.s-bad .si{background:var(--bad-s);color:var(--bad-d)}
.s-warn .si{background:var(--warn-s);color:var(--warn-d)}.s-info .si{background:var(--info-s);color:var(--info-d)}
.s-navy .si{background:#e6ecf5;color:var(--navy)}
.sb{min-width:0}
.sv{display:block;font-size:1.75rem;font-weight:700;line-height:1.1}
.sl{display:block;font-weight:700;font-size:.93rem}
.stat small{display:block;color:var(--mut);font-size:.8rem}

/* badges and pills */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.badge .ic{width:14px;height:14px}
.b-ok{background:var(--ok-s);color:var(--ok-d)}.b-bad{background:var(--bad-s);color:var(--bad-d)}
.b-warn{background:var(--warn-s);color:var(--warn-d)}.b-info{background:var(--info-s);color:var(--info-d)}
.b-muted{background:var(--muted-s);color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.85rem;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill .ic{width:14px;height:14px}
.p-ok{background:var(--ok-s);color:var(--ok-d)}.p-bad{background:var(--bad-s);color:var(--bad-d)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.95rem;transition:background .15s,border-color .15s;text-align:center}
.btn.pri{background:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.sec{background:#fff;color:var(--pri);border-color:var(--line2)}.btn.sec:hover{background:var(--pri-s);border-color:var(--pri)}
.btn.danger{background:#fff;color:var(--bad-d);border-color:#f0b4b4}.btn.danger:hover{background:var(--bad-s)}
.btn.dangerf{background:var(--bad);color:#fff}.btn.dangerf:hover{background:var(--bad-d)}
.btn.ghost{background:transparent;color:var(--mut);border-color:var(--line)}.btn.ghost:hover{background:var(--muted-s)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.85rem}
.btn.lg{min-height:52px;padding:10px 22px;font-size:1.02rem}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.link{background:none;border:0;color:var(--pri);font-weight:700;padding:8px 0 0;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}

/* callouts */
.callout{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:14px 16px;margin:0 0 16px}
.callout .ic{margin-top:2px}
.callout p{margin:2px 0 0}
.callout.ok{background:var(--ok-s);color:#14532d}.callout.warn{background:var(--warn-s);color:#7c2d12}
.callout.bad{background:var(--bad-s);color:#7f1d1d}.callout.info{background:var(--info-s);color:#1e3a8a}
.card .callout{margin:12px 0}
.cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-radius:var(--r);padding:16px 18px;margin-bottom:16px;border:1px solid}
.cta.warn{background:var(--warn-s);border-color:#f6d19b;color:#7c2d12}
.cta.ok{background:var(--ok-s);border-color:#b7e2c4;color:#14532d}
.cta.info{background:var(--info-s);border-color:#bcd2f7;color:#1e3a8a}
.cta>.ic{width:30px;height:30px}
.cta>div{flex:1 1 220px}
.cta p{margin:2px 0 0;opacity:.85}
.ferr{display:flex;gap:8px;align-items:flex-start;color:var(--bad-d);background:var(--bad-s);border-radius:8px;padding:10px 12px;font-size:.92rem;margin:10px 0 0;font-weight:700}
.wait{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:.92rem;margin:14px 0 0;padding:10px 12px;background:var(--soft);border-radius:8px}

/* tasks */
.task{border-left:5px solid var(--warn)}
.t-ok{border-left-color:var(--ok)}.t-bad{border-left-color:var(--bad)}.t-info{border-left-color:var(--info)}.t-muted{border-left-color:var(--line2)}
.task-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.task h3{margin:4px 0 0;font-size:1.1rem}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.eyebrow .ic{width:14px;height:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.det{color:var(--mut);margin:8px 0 0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:12px 0;padding:12px 14px;background:var(--soft);border-radius:10px}
.meta dt{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.meta dt .ic{width:15px;height:15px}
.meta dd{margin:3px 0 0;font-size:.93rem}
.tl{list-style:none;display:flex;margin:16px 0 4px;padding:0}
.tl li{flex:1;position:relative;text-align:center;font-size:.75rem;color:var(--mut);padding-top:24px;min-width:0}
.tl li::before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:3px;background:var(--line)}
.tl li:first-child::before{display:none}
.protonote{background:#fff7e6;border-left:4px solid #f28c28;padding:8px 12px;border-radius:8px;font-size:13px;margin:0 0 14px;color:#5b3a00}
.tl .dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid var(--line2);z-index:1}
.tl li.done{color:var(--ink)}.tl li.done .dot{background:var(--ok);border-color:var(--ok)}.tl li.done::before,.tl li.now::before{background:var(--ok)}
.tl li.now{color:var(--pri);font-weight:700}.tl li.now .dot{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-s)}
.tl li.now.late{color:var(--bad-d)}.tl li.now.late .dot{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-s)}
.ladder{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:.8rem;margin:10px 0 0;color:var(--mut)}
.ladder .ic{width:14px;height:14px}
.lstep{padding:2px 8px;border-radius:6px;background:var(--muted-s)}
.lstep.cur{background:var(--navy);color:#fff;font-weight:700}
.evid{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;background:var(--info-s);border-radius:10px;padding:12px;margin:12px 0 0}
.evid>div{flex:1 1 200px}
.evid b{display:flex;align-items:center;gap:6px}
.evid p{margin:4px 0 0}
.evid img{max-width:200px;width:100%;border-radius:8px;border:1px solid var(--line)}
.fixbox{border:1px dashed var(--line2);border-radius:12px;padding:14px;margin-top:14px;background:#fbfcfe}
.fixbox h4{margin:0 0 6px;font-size:1rem}
details.hist{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
details.hist summary{cursor:pointer;color:var(--mut);font-weight:700;font-size:.88rem;min-height:36px;display:flex;align-items:center}
details.hist ol{margin:6px 0 0;padding-left:20px;font-size:.86rem;color:var(--mut)}
details.hist li{margin-bottom:4px;overflow-wrap:anywhere}

/* forms */
.field{margin:12px 0}
.lbl{display:block;font-weight:700;font-size:.93rem;margin-bottom:6px}
input[type=text],input[type=number],select.inp{width:100%;max-width:420px;border:1px solid var(--line2);border-radius:10px;min-height:46px;padding:8px 12px;background:#fff;color:var(--ink)}
input[type=text]:focus,input[type=number]:focus,select.inp:focus{border-color:var(--pri);outline:3px solid var(--pri-s);outline-offset:0}
.upload{display:flex;align-items:center;gap:12px;border:2px dashed var(--line2);border-radius:12px;padding:14px;cursor:pointer;background:#fff;max-width:420px;color:var(--pri)}
.upload:hover{border-color:var(--pri);background:var(--pri-s)}
.upload span b{display:block}
.upload small{display:block;color:var(--mut)}
.upload .ic{width:28px;height:28px}
.upload.loading{color:var(--mut);cursor:progress}
input[type=file]:focus-visible+.upload,.upload:focus-within{outline:3px solid #f59e0b}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pv{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.pv img{max-width:200px;width:100%;border-radius:10px;border:1px solid var(--line)}
.prog{margin-bottom:14px}
.prog-t{font-size:.88rem;color:var(--mut);font-weight:700;margin-bottom:6px}
.prog-b{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.prog-b span{display:block;height:100%;background:var(--pri);border-radius:999px;transition:width .25s}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.q.answered{border-color:#bcd2f7;background:#f9fbff}
.qh{display:flex;gap:12px;align-items:flex-start;flex:1 1 280px;min-width:0}
.qh p{margin:2px 0 0;color:var(--mut);font-size:.9rem}
.qn{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:700;flex:0 0 auto}
.yn{display:flex;gap:8px}
.ynb{min-width:108px;min-height:52px;border-radius:12px;border:2px solid var(--line2);background:#fff;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.ynb:hover{border-color:var(--pri)}
.ynb.y[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.ynb.n[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff}
.big-num{max-width:200px!important;font-size:1.15rem;min-height:52px!important}
.sub-q{flex-basis:100%;padding-top:10px;border-top:1px dashed var(--line)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line2);background:#fff;border-radius:10px;padding:8px 14px;min-height:46px;text-align:left;color:var(--ink);font-weight:700;font-size:.93rem}
.opt:hover{border-color:var(--pri)}
.opt[aria-pressed=true]{border-color:var(--pri);background:var(--pri-s);color:var(--pri-d)}
.opt.dis{color:var(--mut);background:var(--muted-s);border-style:dashed;cursor:not-allowed}
.qb{padding:14px 0;border-bottom:1px solid var(--line)}
.qb .qh{margin-bottom:10px;align-items:center}
.seg{display:inline-flex;background:var(--muted-s);border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 14px;min-height:40px;font-weight:700;color:var(--mut)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.set{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set:last-child{border-bottom:0}
.set label{flex:1 1 260px}
.set small{display:block;color:var(--mut);font-size:.82rem}
.set input{max-width:120px}
.set select.inp{max-width:220px}

/* facilities & comparison */
.fac .fi-row{display:grid;grid-template-columns:38px minmax(0,1fr) 130px 130px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fac .fi-row:last-child{border-bottom:0}
.fac .fi-row.head{font-size:.75rem;color:var(--mut);font-weight:700;padding:0 0 8px}
.fac.one .fi-row{grid-template-columns:38px minmax(0,1fr) 150px}
.fic{width:38px;height:38px;border-radius:10px;background:var(--pri-s);color:var(--pri);display:grid;place-items:center}
.src{display:inline-flex;gap:4px;align-items:center;font-size:.75rem;font-weight:700;color:var(--mut)}
.src .ic{width:14px;height:14px}
.cmp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.cmp.diff{border-color:#f0b4b4;background:#fff7f7}
.cmp-n{display:flex;align-items:center;gap:10px;font-weight:700}
.cmp-c small{display:flex;align-items:center;gap:4px;color:var(--mut);font-size:.74rem;font-weight:700}
.cmp-c small .ic{width:14px;height:14px}
.cmp-c span{font-weight:700}

/* charts */
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:0 0 auto}
.dn{font-size:20px;font-weight:700;fill:var(--ink)}.dl{font-size:9px;fill:var(--mut)}
.legend{list-style:none;margin:0;padding:0;flex:1 1 150px}
.legend li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.92rem;border-bottom:1px solid var(--line)}
.legend li:last-child{border-bottom:0}
.legend b{margin-left:auto}
.sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.bars .bar{display:grid;grid-template-columns:minmax(80px,150px) minmax(0,1fr) 44px;gap:10px;align-items:center;padding:7px 0;font-size:.9rem}
.bt{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.bf{display:block;height:100%;border-radius:999px;transition:width .4s}
.f-info{background:var(--pri)}.f-bad{background:var(--bad)}.f-ok{background:var(--ok)}.f-warn{background:var(--warn)}
.bars .bar b{text-align:right}

/* lists */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .fi{width:30px;height:30px;border-radius:50%;background:var(--muted-s);color:var(--mut);display:grid;place-items:center;flex:0 0 auto}
.feed .fi .ic{width:16px;height:16px}
.feed li.deny .fi{background:var(--bad-s);color:var(--bad-d)}.feed li.esc .fi{background:var(--warn-s);color:var(--warn-d)}
.feed li>div{min-width:0}
.feed p{margin:0;font-size:.9rem;overflow-wrap:anywhere}
.feed small{color:var(--mut)}
.tlist{list-style:none;margin:0;padding:0}
.trow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow>div{flex:1;min-width:0}
.trow small{display:block;color:var(--mut)}
.dotc{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.d-ok{background:var(--ok)}.d-bad{background:var(--bad)}.d-warn{background:var(--warn)}.d-info{background:var(--info)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:620px}
.tbl th{background:var(--soft);text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty .ei{width:56px;height:56px;border-radius:50%;background:var(--pri-s);color:var(--pri);display:grid;place-items:center;margin:0 auto 10px}
.empty .ei .ic{width:26px;height:26px}
.empty b{display:block;color:var(--ink);font-size:1.05rem}
.empty p{margin:4px auto 0;max-width:46ch}
.empty .acts{justify-content:center}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:14px;font-weight:700;color:var(--ink);text-align:left;min-height:92px}
.qa button:hover{border-color:var(--pri);background:var(--pri-s)}
.qa .ic{color:var(--pri);width:24px;height:24px}
.qa small{font-weight:400;color:var(--mut)}

/* toast & modal */
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;box-shadow:var(--sh2);padding:12px 12px 12px 14px;border-left:5px solid var(--ok);animation:tin .2s ease-out}
.toast>.ic{color:var(--ok-d);margin-top:2px}
.toast.bad{border-left-color:var(--bad)}.toast.bad>.ic{color:var(--bad-d)}
.toast.warn{border-left-color:var(--warn)}.toast.warn>.ic{color:var(--warn-d)}
.toast.info{border-left-color:var(--info)}.toast.info>.ic{color:var(--info-d)}
.toast>div{flex:1;min-width:0}
.toast b{display:block}
.toast p{margin:2px 0 0;font-size:.9rem;color:var(--mut)}
.toast button{background:none;border:0;color:var(--mut);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.toast button:hover{background:var(--muted-s)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal{position:fixed;inset:0;background:rgba(11,37,69,.5);display:grid;place-items:center;z-index:90;padding:16px;animation:fade .15s ease-out}
.dlg{background:#fff;border-radius:16px;box-shadow:var(--sh2);max-width:460px;width:100%;padding:22px}
.dlg h3{margin:0 0 8px;display:flex;gap:10px;align-items:center;font-size:1.15rem}
.dlg h3 .ic{color:var(--pri)}
.dlg.danger h3 .ic{color:var(--bad-d)}
.dlg p{color:var(--mut);margin:0}
.dlg .acts{justify-content:flex-end;margin-top:20px}

/* responsive */
@media (max-width:900px){
 .side{transform:translateX(-105%);width:290px;box-shadow:var(--sh2)}
 body.drawer .side{transform:none}
 body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(11,37,69,.5);z-index:35}
 .mainwrap{margin-left:0}
 .colbtn{display:none}
 .closebtn{display:grid}
 .menu{display:grid}
 main{padding:16px}
 .top{padding:10px 16px}
 .ph h1{font-size:1.35rem}
}
@media (max-width:600px){
 .ctx{margin-left:0;width:100%}
 .ctx select{flex:1 1 160px}
 .stats{grid-template-columns:1fr 1fr;gap:10px}
 .stat{flex-direction:column;padding:12px;gap:8px}
 .sv{font-size:1.45rem}
 .card{padding:14px}
 .ynb{min-width:0;flex:1 1 0}
 .yn{width:100%}
 .fac .fi-row{grid-template-columns:32px minmax(0,1fr) 78px 78px;gap:6px}
 .fac.one .fi-row{grid-template-columns:32px minmax(0,1fr) 110px}
 .fic{width:32px;height:32px}
 .cmp{grid-template-columns:1fr 1fr}
 .cmp-n,.cmp-r{grid-column:1/-1}
 .tl li{font-size:.68rem}
 .bars .bar{grid-template-columns:minmax(70px,110px) minmax(0,1fr) 36px}
 .acts .btn{flex:1 1 auto}
 #toasts{left:16px;right:16px;width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<aside class="side" id="side" aria-label="Menu"></aside>
<div class="scrim" data-ui="closeside"></div>
<div class="mainwrap">
<header class="top" id="top"></header>
<main id="app"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal"></div>
<script>
/* =====================================================================
   BUSINESS LOGIC (unchanged from the original prototype)
   ===================================================================== */
const SCH={A:{n:"Demo School A",b:1},B:{n:"Demo School B",b:1},C:{n:"Demo School C",b:1},D:{n:"Demo School D",b:2},E:{n:"Demo School E",b:2}};
const HOME={V1:"B",V2:"D"};
const SH={HM:"Headmaster",V1:"Verifier 1",V2:"Verifier 2",BO:"Block education officer",BMO:"Block maintenance owner",BSO:"Block supply owner",DO:"District education officer",DSO:"District supply owner",AD:"Platform administrator"};
const PILL={HM:"Headmaster",V1:"Verifier 1",V2:"Verifier 2",BO:"Block officer",BMO:"Block maintenance",BSO:"Block supply",DO:"District officer",DSO:"District supply",AD:"Admin"};
const INFO={HM:"You run one school. Fill in the weekly check, report small repairs, and fix problems sent to you.",
V1:"You visit other schools (never your own). Write down what you see, then check if problems were fixed.",
V2:"You visit other schools (never your own). Write down what you see, then check if problems were fixed.",
BO:"You look after all schools in one block. Take charge of problems that schools could not fix.",
BMO:"You handle repairs in your block that need building work.",
BSO:"You handle pad supplies in your block when stock is missing.",
DO:"You help when a problem is still not fixed at block level. You can compare blocks.",
DSO:"You handle supply problems that reached the district.",
AD:"You set the time limits and rules. You cannot see the details of any problem."};
const CHK=[["p","Pads in stock (physical count)"],["a","Pads reachable: unlocked, private, a person available"],["t","Girls’ toilet usable"],["w","Water and soap available"],["d","Disposal usable"]];
const CN={p:"Pad stock",pd:"Pad stock",a:"Pad accessibility",t:"Girls’ toilet",w:"Water and soap",d:"Disposal"};
const CH={a:["HM","BO","DO"],tfix:["HM","BMO","DO"],twork:["BMO","DO"],pstock:["BSO","DSO"],disc:["HM","BO","DO"],sup:["BSO","DSO"],spot:["HM","BO","DO"],other:["BO","DO"],rec:["HM","BMO","DO"]};
const FIX={a:"Place unlocked and private, and a named staff member available to help",tfix:"Usable, separate and private at the next check",twork:"Works completed and usable at the next check",pstock:"Pads delivered and physically counted",disc:"The difference is explained in the ledger, or stock is corrected",sup:"Supply arrives and is counted",spot:"Repair confirmed by a verifier",other:"Issue resolved and confirmed",rec:"A lasting repair confirmed by a verifier"};
const SRC={report:"the school’s weekly report",visit:"a verifier visit",school:"a failed check raised by the school",other:"an issue not on the small-repair list",rec:"the recurrence rule",spot:"a failed spot check",supply:"a supply report"};
const PLACES=["Corridor outside the toilets","Classroom block","Outside the toilet area","Water point","Other place"];
const ST_UN=["Assigned","No owner accepted","Overdue, escalated"];
const ST_WAIT=["Evidence submitted","Fix recorded","Closed on evidence"];
const KEY="nivaaran-prototype-v7";
const YN=["yes","no"];
const isV=()=>S.role==="V1"||S.role==="V2";
const nextRev=t=>t.last==="V1"?"V2":"V1";
const D=s=>S.d[s];
const open=t=>!t.st.startsWith("Closed");
const pad=n=>n===1?"pad":"pads";
let S,RO=false,VO=false;

function base(){const d={};Object.keys(SCH).forEach(s=>d[s]={rep:null,obs:null,ledger:[]});
 return{day:0,off:false,role:"HM",school:"A",block:1,n:1,closedN:0,ph:[],d:d,it:[],err:{},dr:{},log:[],ui:{page:"problem",step:0,reveal:false,lane:"",sub:{},flt:"all"},demo:0,
 cfg:{vis:2,spotN:2,recLimit:2,recDays:30,accDays:1,stale:7,week:7,retain:30,verDays:7,
  la:{tap:{n:"Leaking tap, water still available",d:5},bulb:{n:"Broken bulb in a corridor outside the toilets",d:3},wall:{n:"Minor wall or floor repair outside toilet and pad areas",d:14},fit:{n:"Loose or worn fitting that does not affect privacy or use",d:7}},
  b:{a:3,tfix:5,twork:14,pstock:3,disc:3,sup:7,spot:3,other:7,rec:7}}}}
function fresh(){S=base();seed();S.log=[{d:0,w:"System",t:"Prototype started. Fictional Demo District, two blocks, five schools. Schools B to E hold seeded demo data.",k:"meta",q:false,a:"HM",s:"",l:""}];return S}
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);return S}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ev(w,t,k,s,l){S.log.unshift({d:S.day,w:w,t:t,k:k||"",q:S.off,a:S.role,s:s||"",l:l||""})}
function th(t,w,txt,k){t.h.push({d:S.day,w:w,t:txt});ev(w,`${t.id}: ${txt}`,k,t.s,t.lane)}
function deny(m){ev(SH[S.role],"ACCESS DENIED: "+m,"deny",S.school,"");S.flash="Not allowed: "+m}
function need(r,m){r=[].concat(r);if(r.includes(S.role))return true;deny(m);return false}
function setSt(t,st){t.st=st;t.since=S.day}
function grab(){document.querySelectorAll("#app select[id],#app input[id]:not([type=file])").forEach(e=>{S.dr[e.id]=e.value})}
function hs(x){let h=0;for(let i=0;i<x.length;i+=37)h=(h*31+x.charCodeAt(i))|0;return h}
function clearDr(){Object.keys(S.dr).forEach(k=>{if(!k.startsWith("photo_"))delete S.dr[k]})}
function dv(id){return S.dr[id]===undefined?"":S.dr[id]}
function sel(id,opts,ph){const v=dv(id);return `<select id="${id}" aria-label="${ph||id}"><option value="">${ph||"Choose"}</option>${opts.map(o=>{const a=Array.isArray(o)?o:[o,o];return `<option value="${a[0]}"${a[0]===v?" selected":""}>${a[1]}</option>`}).join("")}</select>`}
function num(id){return `<input id="${id}" type="number" min="0" placeholder="Number" value="${dv(id)}">`}
const CQ={p:"How many pads are in the school right now? Count them yourself.",a:"Can a girl reach pads easily? The place is unlocked, private, and a person is available.",t:"Is the girls’ toilet usable? Separate, working, with privacy.",w:"Are water and soap both available?",d:"Is there a usable way to dispose of used pads?"};
function ynb(id){const v=dv(id);return `<div class="yn" role="group" aria-label="Answer"><button type="button" data-a="yn" data-i="${id}:yes" aria-pressed="${v==="yes"}">Yes</button><button type="button" data-a="yn" data-i="${id}:no" aria-pressed="${v==="no"}">No</button></div>`}
function chk(pre,verify){return `<div>${CHK.map(([k],n)=>`<div class="chk"><div><b>${n+1}. ${CN[k]}</b><div class="mut">${CQ[k]}</div></div><div class="two">${k==="p"?num(pre+"p"):ynb(pre+k)}${verify&&["t","w","d"].includes(k)?sel("fx_"+k,[["fix","School can fix"],["works","Needs works"]],"If not usable, who can fix it?"):""}</div></div>`).join("")}</div>`}
function formR(){return chk("r_",false)}
function formO(){return chk("o_",true)}
function read(pre){const o={};for(const [k] of CHK){const v=dv(pre+k);if(v==="")return null;if(k==="p"){if(!(+v>=0))return null;o.p=Math.round(+v)}else o[k]=v}return o}
function led(s){const L=D(s).ledger,o=L.filter(x=>x.type==="out").reduce((a,x)=>a+x.n,0),i=L.filter(x=>x.type==="in").reduce((a,x)=>a+x.n,0);return{out:o,inn:i,exp:D(s).rep?D(s).rep.p+i-o:0}}
function mkB(s,key,k,type,det,src,x){const c=S.cfg,ch=CH[key];
 const t=Object.assign({id:"T"+(S.n++),lane:"B",s:s,key:key,k:k,type:type,det:det,fix:FIX[key],chain:ch.slice(),lvl:0,owner:ch[0],day0:S.day,due:S.day+c.b[key],accBy:S.day+c.accDays,st:"Assigned",since:S.day,re:0,h:[],photo:null,staff:"",expl:0,dir:"",diff:0,last:"V1",src:src,ver:src==="visit",dist:false,dept:false,vlate:false},x||{});
 S.it.push(t);th(t,"System",`created from ${SRC[src]}. Assigned to ${SH[t.owner]}, accept by day ${t.accBy}, due day ${t.due}. Fixed means: ${t.fix}.`);return t}
function mkA(s,type,place,x){const t=Object.assign({id:"L"+(S.n++),lane:"A",s:s,type:type,place:place,st:"Logged",day0:S.day,due:S.day+S.cfg.la[type].d,photo:null,sample:false,spot:null,cant:0,spotBy:"",h:[]},x||{});S.it.push(t);return t}
function reopen(t,why){t.lvl=0;t.owner=t.chain[0];t.re++;t.photo=null;t.staff="";t.dist=false;t.dept=false;t.vlate=false;t.accBy=S.day+S.cfg.accDays;t.due=S.day+S.cfg.b[t.key];setSt(t,"Assigned");th(t,"System",`${why}. Reopened (${t.re}). Earlier history stays. Assigned to ${SH[t.owner]}.`,"esc")}
function raise(s,key,k,type,det,src){
 if(k){const m=S.it.filter(t=>t.lane==="B"&&t.s===s&&t.k===k),o=m.find(open);if(o)return o;const c=m.filter(t=>!open(t)).pop();if(c){reopen(c,"The problem was found again by "+SRC[src]);return c}}
 return mkB(s,key,k,type,det,src)}
function seed(){
 const M=(s,rep,obs)=>{D(s).rep=rep;if(obs)D(s).obs=obs};
 M("B",{p:60,a:"yes",t:"no",w:"yes",d:"yes",day:-1});
 M("D",{p:40,a:"yes",t:"yes",w:"yes",d:"yes",day:-8},{p:40,a:"no",t:"yes",w:"yes",d:"yes",by:"V1",day:-7,fx:{}});
 M("E",{p:0,a:"yes",t:"yes",w:"yes",d:"yes",day:-2});
 mkB("B","tfix","t","Accurate report, unresolved facility gap","Girls’ toilet reported unusable. Not yet verified by a visit.","report",{day0:-1,due:4,accBy:1,ver:false});
 mkB("D","a","a","Accessibility gap","Reported as reachable. At the visit the pads could not be reached.","visit",{day0:-7,due:-4,accBy:-6,st:"No owner accepted",lvl:2,owner:"DO",dist:true,dept:true});
 mkB("E","pstock","p","Pad stock absent","The school reported zero pads. Not yet verified by a visit.","report",{day0:-2,due:1,accBy:1,ver:false});
 mkA("B","tap",PLACES[3],{day0:-6,due:-1,st:"Closed (school-level)",closedDay:-2,sample:true});
 mkA("B","wall",PLACES[1],{day0:-1,due:13});
 mkA("E","bulb",PLACES[0],{day0:-5,due:-2,st:"Overdue at school level"});
 mkA("E","fit",PLACES[1],{day0:-1,due:6});
 S.closedN=1}

function visitClassify(s){
 const R=D(s).rep,O=D(s).obs,L=led(s),by=SH[O.by];
 ["a","t","w","d"].forEach(k=>{
  const op=S.it.find(t=>t.lane==="B"&&t.s===s&&t.k===k&&open(t));
  if(O[k]==="no"){
   if(op){if(!op.ver){op.ver=true;th(op,by,"confirmed at the visit.")}
    if(k!=="a"&&O.fx&&O.fx[k]==="works"&&op.key==="tfix"){op.key="twork";op.chain=CH.twork.slice();op.lvl=0;op.owner="BMO";op.fix=FIX.twork;op.accBy=S.day+S.cfg.accDays;op.due=S.day+S.cfg.b.twork;th(op,by,"says this needs works. Routed to the block maintenance owner.")}}
   else{const key=k==="a"?"a":(O.fx&&O.fx[k]==="works"?"twork":"tfix");
    const ty=!R?CN[k]+": found at the visit, no report to compare":k==="a"?(R.a==="yes"?"Accessibility gap":"Accurate report, unresolved facility gap"):(R[k]==="yes"?CN[k]+": facility gap, report did not match":"Accurate report, unresolved facility gap");
    raise(s,key,k,ty,k==="a"&&R&&R.a==="yes"?"Reported as reachable. At the visit the pads could not be reached.":"Observed not usable or not reachable at the visit.","visit")}
  }else if(op&&!op.ver&&op.src==="report"){setSt(op,"Closed");th(op,by,"saw it working at the visit. Closed by observation.")}});
 if(!R){ev(by,"No weekly report to compare with. Shown as Unverified: no report.","",s,"B");return}
 if(O.p===0){const t=raise(s,"pstock","p","Pad stock absent",`Counted 0 at the visit. Expected ${L.exp}.`,"visit");if(!t.ver){t.ver=true;th(t,by,"confirmed at the visit.")}}
 else if(O.p!==L.exp){const dir=O.p<L.exp?"short":"over";raise(s,"disc","pd","Stock discrepancy to reconcile",`Reported ${R.p}. The ledger shows ${L.out} given out and ${L.inn} received, so ${L.exp} expected. Counted ${O.p}. Difference ${Math.abs(L.exp-O.p)}. Not treated as dishonesty.`,"visit").dir=dir;const t=S.it.find(x=>x.s===s&&x.k==="pd"&&open(x));if(t)t.diff=Math.abs(L.exp-O.p)}
 else ev(by,`Stock check: counted ${O.p}, expected ${L.exp}. Matches the ledger. No gap.`,"",s,"B")}

function tick(n){
 ev("Clock",`Moved forward ${n} day${n>1?"s":""}.`,"meta");
 const c=S.cfg;
 for(let i=0;i<n;i++){S.day++;S.it.forEach(t=>{
  if(t.lane==="A"){
   if(["Logged","In repair"].includes(t.st)&&S.day>t.due){t.st="Overdue at school level";th(t,"System","deadline passed. Overdue at school level. It does not escalate.")}
   if(t.photo&&t.closedDay!==undefined&&S.day-t.closedDay>c.retain){t.photo=null;th(t,"System","repair photo removed after the retention period.")}
   return}
  if(!open(t)){if(t.photo&&S.day-t.since>c.retain){t.photo=null;th(t,"System","evidence photo removed after the retention period.")}return}
  const last=t.lvl>=t.chain.length-1,un=ST_UN.includes(t.st);
  const up=(reason,st)=>{if(!last){t.lvl++;t.owner=t.chain[t.lvl];if(t.owner==="DO"||t.owner==="DSO")t.dist=true;th(t,"System",`${reason}. Escalated to ${SH[t.owner]}. This is a request for help.`,"esc");setSt(t,st);t.accBy=S.day+c.accDays;t.due=S.day+c.b[t.key]}
   else if(!t.dept){t.dept=true;th(t,"System",`${reason}. Already at the last level. Now on the state overdue list.`,"esc");t.accBy=S.day+c.accDays}};
  if(un&&S.day>t.accBy)up(`no owner accepted by day ${t.accBy}`,"No owner accepted");
  else if(!un&&!ST_WAIT.includes(t.st)&&S.day>t.due)up(`overdue after acceptance (due day ${t.due})`,"Overdue, escalated");
  if(ST_WAIT.includes(t.st)&&S.day-t.since>c.verDays&&!t.vlate){t.vlate=true;th(t,"System",`waiting for a verifier for more than ${c.verDays} days. Shown to the block officer. The school is not escalated for this.`,"esc")}})}}

function laLog(){
 const s=S.school,f=id=>dv(id);
 if(!f("lq1")||(f("lq1")!=="yes"&&(!f("lqt")||!f("lqp")||!f("lq3")))){S.err.la="Please answer all the questions first.";return}
 if(f("lq1")==="yes"){const k=f("lqk");if(!k){S.err.la="Please choose which check fails.";return}
  const key=k==="a"?"a":k==="p"?"pstock":"tfix";
  raise(s,key,k==="p"?"p":k,"Failed check raised by the school",`${CN[k]} reported as failing by the school. Not yet verified by a visit.`,"school");
  S.err.la=`This affects “${CN[k]}”, which is too important to be a small repair. It has been sent as a follow-up task, and a visitor will check it. See “My tasks”.`;clearLa();return}
 if(f("lqt")==="other"){mkB(s,"other","","Other issue (not on the small-repair list)",f("lqn")||"No note added.","other");
  S.err.la="This type is not on the small-repair list, so it was sent to the block officer as a follow-up task.";clearLa();return}
 if(f("lq3")==="yes"){ev("System","Safeguarding path shown to the headmaster. No task was created. Nothing about the concern is stored here.","meta");
  S.err.la="This may involve a girl’s safety or privacy. Do not use this app for it. Call Child Helpline 1098, the police, or your school’s safety contact. Nothing about it is saved here.";clearLa();return}
 const type=f("lqt"),place=f("lqp"),c=S.cfg;

function waitText(t){const o=SH[t.owner].toLowerCase();return {"Assigned":`Waiting for the ${o} to accept.`,"No owner accepted":`Waiting for the ${o} to accept.`,"Overdue, escalated":`Waiting for the ${o} to accept.`,"Accepted":["a","disc"].includes(t.key)?"Waiting for the school to submit evidence or a fix.":`Waiting for the ${o} to act.`,"Evidence submitted":`Waiting for ${SH[nextRev(t)]} to review the evidence at their desk. No trip needed.`,"Fix recorded":`Waiting for ${SH[nextRev(t)]} at the next routine visit.`,"Closed on evidence":`Closed for now. ${SH[nextRev(t)]} confirms it in person at the next routine visit.`,"Closed":"Case closed."}[t.st]}
function scopeB(r){

 if(r==="BMO")return T.filter(t=>SCH[t.s].b===S.block&&(["tfix","twork","rec"].includes(t.key)||t.owner==="BMO"));
 if(r==="BSO")return T.filter(t=>SCH[t.s].b===S.block&&(sup(t)||t.owner==="BSO"));
 if(r==="DO")return T.filter(t=>t.dist&&!sup(t));
 if(r==="DSO")return T.filter(t=>t.dist&&sup(t));
 return []}
function mineT(r){
 if(isVr(r))return S.it.filter(t=>t.lane==="B"&&ST_WAIT.includes(t.st)&&nextRev(t)===r&&t.s!==HOME[r]);

 if(r==="HM")return T.filter(t=>(ST_UN.includes(t.st)&&t.owner==="HM")||(t.st==="Accepted"&&(t.owner==="HM"||["a","disc"].includes(t.key))));
 return T.filter(t=>t.owner===r)}
function spotList(r){return S.it.filter(i=>i.lane==="A"&&i.sample&&!i.spot&&i.st==="Closed (school-level)"&&i.spotBy!==r&&i.s!==HOME[r])}
function stat(s){

 const rep=d.rep?(S.day-d.rep.day>S.cfg.stale?"Unverified: report is stale":d.obs&&d.obs.day>=d.rep.day?"Reported and verified":"Reported, awaiting a visit"):"Unverified: no report";
 const lo=["Logged","In repair","Overdue at school level"];
 return{rep:rep,open:O.length,noown:O.filter(t=>t.st==="No owner accepted"||t.st==="Overdue, escalated").length,over:O.filter(t=>S.day>t.due&&!ST_WAIT.includes(t.st)).length,re:B.filter(t=>t.re>0).length,closed:B.length-O.length,
  la:{n:A.length,ont:A.filter(i=>i.closedDay!==undefined&&i.closedDay<=i.due).length,ov:A.filter(i=>lo.includes(i.st)&&S.day>i.due).length,sp:A.filter(i=>i.spot).length,pend:A.filter(i=>i.sample&&!i.spot&&i.st==="Closed (school-level)").length}}}
function laCell(x){return S.cfg.vis===1?"Not shared":`${x.n} logged, ${x.ont} on time, ${x.ov} overdue, ${x.sp} spot-checked, ${x.pend} spot checks pending`}
function visible(x){
 const r=S.role;
 if(x.k==="meta")return true;
 if(x.k==="deny")return r==="AD"||x.a===r;
 if(r==="AD")return false;
 if(r==="HM")return x.s===S.school&&x.l!=="";
 if(isVr(r))return x.s===S.school&&x.l==="B";
 if(["BO","BMO","BSO"].includes(r))return x.l==="B"&&x.s&&SCH[x.s].b===S.block;
 return x.l==="B"}
const schoolsOf=b=>Object.keys(SCH).filter(s=>SCH[s].b===b);
function latest(s){const R=D(s).rep,O=D(s).obs;return O&&(!R||O.day>=R.day)?O:R}
const toiletOK=ss=>ss.filter(s=>{const x=latest(s);return x&&x.t==="yes"}).length;

/* ---------- status language & colours ---------- */
const STL={"Closed on evidence":"Closed, to confirm","Closed (school-level)":"Closed by school","Overdue at school level":"Overdue","Overdue, escalated":"Overdue, sent up","No owner accepted":"No one accepted","Assigned":"Waiting to accept","Fix recorded":"Done, to check","Evidence submitted":"Photo sent, to check","Spot-check passed":"Checked: fixed","Logged":"Open","Sent up as follow-up":"Sent up","In repair":"Repair started"};
function tone(st){
 if(["Closed","Closed on evidence","Spot-check passed","Closed (school-level)"].includes(st))return"ok";
 if(["No owner accepted","Overdue, escalated","Overdue at school level"].includes(st))return"bad";
 if(["Assigned","Logged"].includes(st))return"warn";
 if(st==="Sent up as follow-up")return"muted";
 return"info"}
const stBadge=st=>`<span class="badge b-${tone(st)}">${STL[st]||st}</span>`;
function bk(t){if(!open(t))return"ok";if(t.st==="No owner accepted"||t.st==="Overdue, escalated"||(S.day>t.due&&!ST_WAIT.includes(t.st)))return"bad";if(t.st==="Assigned")return"warn";return"info"}
function buckets(T){const b={ok:0,info:0,warn:0,bad:0};T.forEach(t=>b[bk(t)]++);return b}
function dueTxt(d){const n=d-S.day;return n<0?`${-n} day${n===-1?"":"s"} late`:n===0?"due today":`${n} day${n===1?"":"s"} left`}

/* ---------- small building blocks ---------- */

const ferr=m=>`<p class="ferr" role="alert">${ic("alert","sm")}<span>${m}</span></p>`;
const go=(page,label,cls,icon,school)=>`<button class="btn ${cls||"pri"}" data-ui="go" data-page="${page}"${school?` data-school="${school}"`:""}>${icon?ic(icon):""}${label}</button>`;
function statCard(i,label,val,tn,hint,page){const inner=`<span class="si">${ic(i)}</span><span class="sb"><span class="sv">${val}</span><span class="sl">${label}</span>${hint?`<small>${hint}</small>`:""}</span>`;
 return page?`<button class="stat s-${tn}" data-ui="go" data-page="${page}">${inner}</button>`:`<div class="stat s-${tn}">${inner}</div>`}
function ynb2(id){const v=dv(id);return `<div class="yn" role="group" aria-label="Answer"><button type="button" class="ynb y" data-a="yn" data-i="${id}:yes" aria-pressed="${v==="yes"}">${ic("check")}Yes</button><button type="button" class="ynb n" data-a="yn" data-i="${id}:no" aria-pressed="${v==="no"}">${ic("x")}No</button></div>`}

 return `<div class="field"><span class="lbl">${label}</span>${p?`<div class="pv"><img src="${p}" alt="Preview of your photo"><button class="btn ghost sm" data-a="rmph" data-i="${id}">${ic("x","sm")}Remove photo</button></div>`

function actList(n){const lg=S.log.filter(visible).slice(0,n);

const moreLog=()=>`<button class="link" data-ui="go" data-page="log">View all activity ${ic("right","sm")}</button>`;
function trow(t){return `<li class="trow"><span class="dotc d-${bk(t)}"></span><div><b>${SCH[t.s].n}</b> · ${esc(t.type)}<small>${SH[t.owner]} · ${ST_UN.includes(t.st)?`accept by day ${t.accBy} (${dueTxt(t.accBy)})`:t.st==="Accepted"?`fix by day ${t.due} (${dueTxt(t.due)})`:STL[t.st]||t.st}</small></div>${stBadge(t.st)}</li>`}

/* ---------- charts (plain SVG/CSS, no library) ---------- */
function donut(b,title){const tot=b.ok+b.info+b.warn+b.bad,L=[["ok","Resolved"],["info","In progress"],["warn","Pending"],["bad","Overdue"]],C=2*Math.PI*40;let off=0;
 const segs=L.map(([k])=>{if(!b[k])return"";const len=b[k]/tot*C,s=`<circle r="40" cx="50" cy="50" fill="none" stroke="var(--${k})" stroke-width="14" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=len;return s}).join("");
 return `<div class="card"><h3 class="ch">${ic("chart")}${title}</h3>${tot?`<div class="donut"><svg viewBox="0 0 100 100" role="img" aria-label="${L.map(([k,l])=>`${l} ${b[k]}`).join(", ")}"><circle r="40" cx="50" cy="50" fill="none" stroke="var(--line)" stroke-width="14"/>${segs}<text x="50" y="50" text-anchor="middle" class="dn">${tot}</text><text x="50" y="63" text-anchor="middle" class="dl">tasks</text></svg><ul class="legend">${L.map(([k,l])=>`<li><span class="sw" style="background:var(--${k})"></span>${l}<b>${b[k]}</b></li>`).join("")}</ul></div>`:empty("inbox","No tasks yet","")}</div>`}

/* ---------- task cards ---------- */
function timeline(t){const st=t.st,cur=ST_UN.includes(st)?1:st==="Accepted"?2:["Evidence submitted","Fix recorded"].includes(st)?3:st==="Closed on evidence"?4:5;

function actions(t){
 if(RO||VO)return `<p class="wait">${ic("clock")}${waitText(t)}</p>`;
 const r=S.role,st=t.st,e=S.err[t.id]?ferr(S.err[t.id]):"",un=ST_UN.includes(st);
 const B=(a,l,c,i)=>`<button class="btn ${c||"pri"}" data-a="${a}" data-i="${t.id}">${i?ic(i):""}${l}</button>`;
 if(un&&t.owner===r){let b=B("accept","Accept task","pri","check");if(canUp(t))b+=B("up","Send up for help","sec","up");
  if(r==="BO"&&["t","w","d","p"].includes(t.k)&&["tfix","twork","pstock"].includes(t.key))b+=B("rea","Reassign to "+(t.k==="p"?"block supply owner":"block maintenance owner"),"sec","users");
  return `<div class="acts">${b}</div>`}

  if(t.key==="a"&&r==="HM")return `<div class="fixbox"><h4>Show that it is fixed</h4><div class="field"><label class="lbl" for="st_${t.id}">1. Who can give out pads now?</label><input id="st_${t.id}" type="text" placeholder="A staff role, e.g. class teacher" value="${esc(dv("st_"+t.id))}"></div>${photoField(t.id,"2. Photo of the open cupboard or shelf")}${e}<div class="acts">${B("fixev","Send photo and name","pri","send")}${B("fix","Mark done without photo","sec")}</div></div>`;
  if(t.key==="disc"&&r==="HM")return `<div class="fixbox"><h4>Explain the difference</h4><div class="field"><label class="lbl" for="ex_${t.id}">${t.dir==="short"?"How many pads were given out but not written down?":"How many pads were received but not written down?"}</label><input id="ex_${t.id}" type="number" min="1" inputmode="numeric" placeholder="Number of pads" value="${esc(dv("ex_"+t.id))}"></div>${e}<div class="acts">${B("expl","Add to pad record","pri","book")}${B("fix","Mark done without explaining","sec")}</div></div>`;
  if(!["a","disc"].includes(t.key)&&t.owner===r)return `<div class="acts">${B("fix",["pstock","sup"].includes(t.key)?"Record delivery":"Mark as done","pri",["pstock","sup"].includes(t.key)?"truck":"check")}${canUp(t)?B("up","Send up for help","sec","up"):""}</div>`}

  if(st==="Evidence submitted")return `<div class="acts">${B("evok","Photo is fine: close","pri","check")}${B("evno","Not enough: send back","danger","x")}</div>`;

function taskHtml(t,showS){
 const un=ST_UN.includes(t.st);let dl="",late=false;
 if(un){dl=`Accept by day ${t.accBy} · ${dueTxt(t.accBy)}`;late=S.day>t.accBy}
 else if(t.st==="Accepted"){dl=`Fix by day ${t.due} · ${dueTxt(t.due)}`;late=S.day>t.due}
 else if(["Evidence submitted","Fix recorded"].includes(t.st))dl="Waiting for a verifier check";
 return `<article class="card task t-${tone(t.st)}"><div class="task-h"><div><div class="eyebrow">${ic("flag")}Follow-up task · ${t.id}${showS?` · ${SCH[t.s].n}`:""}</div><h3>${esc(t.type)}</h3></div>
<div class="badges">${stBadge(t.st)}${t.ver?`<span class="badge b-info">${ic("shield")}Verified by visit</span>`:`<span class="badge b-muted">${ic("clipboard")}School-reported, not checked yet</span>`}${t.re?`<span class="badge b-warn">Came back ${t.re}×</span>`:""}${t.vlate?`<span class="badge b-bad">Check is late</span>`:""}${t.dept?`<span class="badge b-bad">Long overdue</span>`:""}</div></div>
<p class="det">${esc(t.det)}</p>
<dl class="meta"><div><dt>${ic("user")}Who must act</dt><dd><b>${SH[t.owner]}</b><br><span class="mut sm">${LVL(t.owner)} level</span></dd></div>${dl?`<div><dt>${ic("clock")}Deadline</dt><dd class="${late?"txt-bad":""}">${dl}</dd></div>`:""}<div><dt>${ic("ok")}Counts as fixed when</dt><dd>${t.fix}</dd></div></dl>
${timeline(t)}${ladder(t)}${evBlock(t)}${actions(t)}
<details class="hist"><summary>Full history (${t.h.length})</summary><ol>${t.h.map(x=>`<li><b>Day ${x.d}</b> · ${x.w}: ${esc(x.t)}</li>`).join("")}</ol></details></article>`}
function laHtml(i){

<dl class="meta"><div><dt>${ic("pin")}Where</dt><dd>${i.place}</dd></div>${dl?`<div><dt>${ic("clock")}Deadline</dt><dd class="${i.st==="Overdue at school level"?"txt-bad":""}">${dl}</dd></div>`:""}<div><dt>${ic("user")}Who fixes it</dt><dd>Headmaster. It stays in the school and is never sent up.</dd></div></dl>
${tl}${i.photo&&canPhoto()?`<div class="evid"><div><b>${ic("camera")}Repair photo</b><p class="mut">Taken on device day ${i.photoDay}${i.syncDay!==undefined?`, reached the server on day ${i.syncDay}`:i.photoQ?", not sent yet (offline)":""}.</p></div><img src="${i.photo}" alt="Repair photo"></div>`:""}${b}
<details class="hist"><summary>Full history (${i.h.length})</summary><ol>${i.h.map(x=>`<li><b>Day ${x.d}</b> · ${x.w}: ${esc(x.t)}</li>`).join("")}</ol></details></article>`}

${CHK.map(([k],x)=>`<div class="q${dv(pre+k)!==""?" answered":""}"><div class="qh"><span class="qn">${x+1}</span><div><b>${CN[k]}</b><p>${CQ[k]}</p></div></div><div>${k==="p"?`<label class="sr" for="${pre}p">Number of pads</label><input id="${pre}p" class="big-num" type="number" min="0" inputmode="numeric" placeholder="Number of pads" value="${esc(dv(pre+"p"))}">`:ynb2(pre+k)}</div>${verify&&["t","w","d"].includes(k)&&dv(pre+k)==="no"?`<div class="sub-q"><span class="lbl">Who can fix it?</span>${choice("fx_"+k,[["fix","The school can fix it"],["works","Needs building work"]])}</div>`:""}</div>`).join("")}</div>`}

 return `<div class="card"><div class="ch-row"><h3 class="ch">${ic("school")}Facilities at ${SCH[s].n}</h3></div><div class="fac"><div class="fi-row head"><span></span><span>Check</span><span class="src">${ic("clipboard")}School says</span><span class="src">${ic("shield")}Verified</span></div>

<p class="mut sm">${R?`School report from day ${R.day}${S.day-R.day>S.cfg.stale?" (old, needs a new check)":""}.`:"No weekly check yet."} ${O?`Last independent visit on day ${O.day}.`:"No independent visit yet."}</p></div>`}

/* ---------- navigation ---------- */
function tabsOf(r){const m=mineT(r).length;
 if(r==="HM"){const la=S.it.filter(i=>i.lane==="A"&&i.s===S.school&&laOpen(i)).length,rp=D(S.school).rep,due=!rp||S.day-rp.day>=S.cfg.week;
  return [["dash","Dashboard"],["report","Weekly check",due?"Due":0],["mine","My tasks",m],["lanea","Report a problem",la],["ledger","Pad record"],["all","All school tasks",scopeB(r).length],["log","Activity"]]}
 if(isVr(r))return [["dash","Dashboard"],["visit","School visit"],["mine","To verify",m],["spot","Check small repairs",spotList(r).length],["log","Activity"]];

  if(diff)n++;
  const res=diff?`<span class="badge b-bad">${ic("alert")}Different</span>`:!R?'<span class="badge b-muted">Nothing to compare</span>':bad?'<span class="badge b-warn">Match, not working</span>':`<span class="badge b-ok">${ic("check")}Match</span>`;
  return `<div class="cmp${diff?" diff":""}"><div class="cmp-n"><span class="fic">${ic(CIC[k])}</span>${CN[k]}</div><div class="cmp-c"><small>${ic("clipboard")}School said</small><span>${said}</span></div><div class="cmp-c"><small>${ic("shield")}Visitor saw</small><span>${saw}</span></div><div class="cmp-r">${res}</div></div>`}).join("");
 return{n,html}}
function pgVisit(){const r=S.role,s=S.school,own=s===HOME[r],o=D(s).obs;
 let h=ph("School visit","Look for yourself first. The school’s own answers stay hidden until you save, so your check stays independent.");
 h+=`<div class="card"><span class="lbl">Choose a school</span><div class="opts">${Object.keys(SCH).map(k=>k===HOME[r]?`<span class="opt dis" title="You never check your own school">${ic("lock","sm")}${SCH[k].n} (your own)</span>`:`<button class="opt" data-ui="go" data-page="visit" data-school="${k}" aria-pressed="${k===s}">${k===s?ic("check","sm"):""}${SCH[k].n}</button>`).join("")}</div></div>`;
 if(own)return h+`<div class="callout bad">${ic("lock")}<div><b>This is your own school.</b><p>Verifiers never check their own school. Choose another school above.</p></div></div>`;
 if(!o)return h+`<div class="card"><div class="ch-row"><h3 class="ch">${ic("eye")}What do you see at ${SCH[s].n}?</h3><button class="btn ghost sm" data-a="peek">${ic("lock","sm")}See school’s answers first</button></div>${qform("o_",true)}${S.err.o?ferr(S.err.o):""}
<div class="acts"><button class="btn pri lg" data-a="obs">${ic("shield")}Save what I saw</button><button class="btn sec" data-a="fillo">Fill example answers</button></div></div>`;
 const c=compare(s);
 h+=`<div class="callout ${c.n?"warn":"ok"}">${ic(c.n?"alert":"ok")}<div><b>${c.n?`${c.n} difference${c.n>1?"s":""} found`:"Everything matches the school’s report"}</b><p>${c.n?"Each difference becomes a follow-up task. A difference is never treated as lying.":"Any check that is not working still becomes a task."}</p></div></div>`;
 h+=`<div class="card"><div class="ch-row"><h3 class="ch">${ic("clipboard")}School said vs. visitor saw</h3><span class="mut sm">Visited by ${SH[o.by]} on day ${o.day}</span></div>${c.html}
${S.day>o.day?`<div class="acts"><button class="btn sec" data-a="newvisit">${ic("plus")}Start a new visit</button></div>`:`<p class="mut sm">You can start a new visit from tomorrow (+1 day in Demo controls).</p>`}</div>`;
 const opn=S.it.filter(t=>t.lane==="B"&&t.s===s&&open(t));
 if(opn.length)h+=`<div class="card"><h3 class="ch">${ic("listc")}Open tasks at this school</h3><ul class="tlist">${opn.map(trow).join("")}</ul><p class="mut sm">Next: view the demo as the person who must act.</p></div>`;
 const cl=S.it.filter(t=>t.lane==="B"&&t.s===s&&t.st==="Closed");
 if(cl.length)h+=`<h2 class="sec-t">Fixed problems at this school</h2><p class="mut">If you find one broken again, press <b>Problem came back</b>.</p>`+cl.map(t=>taskHtml(t,false)).join("");
 return h}
function pgSpot(r){const L=spotList(r);const h=ph("Check small repairs","Schools close small repairs themselves. A few are picked at random for you to look at on a normal visit.");
 if(!L.length)return h+`<div class="card">${empty("eye","Nothing to check right now","When schools close small repairs, some are picked for you.")}</div>`;
 return h+L.map(i=>`<article class="card task t-info"><div class="task-h"><div><div class="eyebrow">${ic("wrench")}Small repair · ${SCH[i.s].n}</div><h3>${S.cfg.la[i.type].n}</h3></div><span class="badge b-ok">Closed by school, day ${i.closedDay}</span></div>
<dl class="meta"><div><dt>${ic("pin")}Where</dt><dd>${i.place}</dd></div>${i.cant?`<div><dt>${ic("info")}Note</dt><dd>The other verifier could not tell.</dd></div>`:""}</dl>
${i.photo?`<div class="evid"><div><b>${ic("camera")}School’s photo</b><p class="mut">A photo helps, but it is not proof. Look for yourself.</p></div><img src="${i.photo}" alt="Repair photo"></div>`:`<p class="mut sm">No photo for this example.</p>`}${S.err[i.id]?ferr(S.err[i.id]):""}
<div class="acts"><button class="btn pri" data-a="sc_ok" data-i="${i.id}">${ic("check")}It is fixed</button><button class="btn danger" data-a="sc_no" data-i="${i.id}">${ic("x")}Not fixed</button><button class="btn sec" data-a="sc_ct" data-i="${i.id}">Cannot tell</button></div></article>`).join("")}
function pgSchools(){const ss=schoolsOf(S.block);
 return ph(`Schools in Demo Block ${S.block}`,"Status of every school. Small repairs show numbers only, never details or photos.")+`<div class="card"><div class="tw"><table class="tbl"><thead><tr><th>School</th><th>Weekly check</th><th>Girls’ toilet</th><th>Open</th><th>No one accepted</th><th>Overdue</th><th>Came back</th><th>Small repairs</th></tr></thead><tbody>${ss.map(s=>{const x=stat(s),l=latest(s);
  return `<tr><td><b>${SCH[s].n}</b></td><td>${repBadge(x.rep)}</td><td>${l?`${l.t==="yes"?'<span class="pill p-ok">Working</span>':'<span class="pill p-bad">Not working</span>'}<br><small class="mut">${l===D(s).obs?"verified":"school says"}</small>`:'<span class="mut">No data</span>'}</td><td>${x.open}</td><td>${x.noown?`<span class="txt-bad">${x.noown}</span>`:0}</td><td>${x.over?`<span class="txt-bad">${x.over}</span>`:0}</td><td>${x.re}</td><td class="sm">${laCell(x.la)}</td></tr>`}).join("")}</tbody></table></div><p class="mut sm">${S.cfg.vis===1?"Small-repair numbers are hidden by the department’s rules.":"Toilet status uses the latest report or visit."}</p></div>`}
function pgBlocks(){const rows=[1,2].map(b=>{const ss=schoolsOf(b),X=ss.map(stat),sum=f=>X.reduce((a,x)=>a+f(x),0);
  const la={n:sum(x=>x.la.n),ont:sum(x=>x.la.ont),ov:sum(x=>x.la.ov),sp:sum(x=>x.la.sp),pend:sum(x=>x.la.pend)};
  return {b,n:ss.length,open:sum(x=>x.open),per:(sum(x=>x.open)/ss.length).toFixed(1),noown:sum(x=>x.noown),over:sum(x=>x.over),re:sum(x=>x.re),closed:sum(x=>x.closed),la}});
 return ph("Compare blocks","Blocks have different numbers of schools, so compare “Open per school”, not raw totals.")+`<div class="card"><div class="tw"><table class="tbl"><thead><tr><th>Block</th><th>Schools</th><th>Open</th><th>Open per school</th><th>No one accepted</th><th>Overdue</th><th>Came back</th><th>Closed</th><th>Small repairs</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>Demo Block ${x.b}</b></td><td>${x.n}</td><td>${x.open}</td><td><b>${x.per}</b></td><td>${x.noown?`<span class="txt-bad">${x.noown}</span>`:0}</td><td>${x.over?`<span class="txt-bad">${x.over}</span>`:0}</td><td>${x.re}</td><td>${x.closed}</td><td class="sm">${laCell(x.la)}</td></tr>`).join("")}</tbody></table></div></div>`
 +bars("Open tasks per school",rows.map(x=>["Demo Block "+x.b,+x.per,x.over?"bad":"info"]))}
function pgSettings(){const c=S.cfg,I=(id,v,l,hint)=>`<div class="set"><label for="${id}"><b>${l}</b>${hint?`<small>${hint}</small>`:""}</label><input id="${id}" type="number" min="1" inputmode="numeric" value="${esc(dv(id)!==""?dv(id):v)}"></div>`;
 return ph("Rules & time limits","In real life only the department sets these numbers. Change one and press Save rules.")
 +`<div class="card"><h3 class="ch">${ic("eye")}What officers can see</h3><div class="set"><label for="c_vis"><b>Can block and district officers see small-repair numbers?</b><small>They never see details or photos.</small></label><select id="c_vis" class="inp"><option value="2"${c.vis===2?" selected":""}>Yes, numbers only</option><option value="1"${c.vis===1?" selected":""}>No</option></select></div></div>
<div class="card"><h3 class="ch">${ic("clipboard")}Weekly check and photos</h3>${I("c_week",c.week,"Weekly check every (days)")}${I("c_stale",c.stale,"A weekly check is old after (days)")}${I("c_retain",c.retain,"Keep photos for (days)","Counted from when the problem is closed")}${I("c_verDays",c.verDays,"A verifier check is late after (days)")}</div>
<div class="card"><h3 class="ch">${ic("wrench")}Small repairs</h3>${I("c_spotN",c.spotN,"Spot-check every Nth closed repair","1 means every repair is checked")}${I("c_recLimit",c.recLimit,"Times a repair can repeat before it is sent up")}${I("c_recDays",c.recDays,"…counted over how many days")}${Object.keys(c.la).map(k=>I("c_la_"+k,c.la[k].d,"Days to fix: "+c.la[k].n)).join("")}</div>
<div class="card"><h3 class="ch">${ic("flag")}Follow-up tasks</h3>${I("c_accDays",c.accDays,"Days to accept a task","After this it moves up a level")}${Object.keys(c.b).map(k=>I("c_b_"+k,c.b[k],"Days to fix: "+FIXN[k])).join("")}</div>
${S.err.c?`<div class="callout ${/required/.test(S.err.c)?"bad":"ok"}">${ic(/required/.test(S.err.c)?"alert":"ok")}<div>${S.err.c}</div></div>`:""}<div class="card"><div class="set"><label for="c_why"><b>Reason for the change</b><small>Required. It is saved in the audit log.</small></label><input id="c_why" type="text" value="${esc(dv("c_why"))}"></div></div><div class="acts"><button class="btn pri lg" data-a="cfgsave">${ic("check")}Save rules</button></div>`}
function pgOverdue(){const dl=S.it.filter(t=>t.lane==="B"&&open(t)&&t.dept);
 return ph("Long-overdue list","Problems still not fixed after reaching the top level. Only school, type and age are shown.")+`<div class="card">${dl.length?`<div class="tw"><table class="tbl"><thead><tr><th>School</th><th>Problem</th><th>Who must act</th><th>Days open</th></tr></thead><tbody>${dl.map(t=>`<tr><td><b>${SCH[t.s].n}</b></td><td>${esc(t.type)}</td><td>${SH[t.owner]}</td><td><span class="txt-bad">${S.day-t.day0}</span></td></tr>`).join("")}</tbody></table></div>`:empty("ok","Nothing on the list","")}</div>`}
function pgLog(r){const lg=S.log.filter(visible).slice(0,200);
 return ph(r==="AD"?"Audit log":"Activity",r==="AD"?"Refused access attempts, rule changes and system events. No case content.":"Everything recorded, newest first. Nothing is ever deleted. You only see what this person is allowed to see.")+`<div class="card">${actList(200)}</div>`}
function pageHtml(r,sub){return ({dash:()=>dash(r),report:pgReport,ledger:pgLedger,mine:()=>pgMine(r),all:()=>pgAll(r),lanea:pgLaneA,visit:pgVisit,spot:()=>pgSpot(r),schools:pgSchools,blocks:pgBlocks,settings:pgSettings,overdue:pgOverdue,log:()=>pgLog(r)}[sub]||(()=>dash(r)))()}

/* ---------- render ---------- */
function render(){
 if(S.ui.loading&&S.dr["photo_"+S.ui.loading])S.ui.loading=null;
 const r=S.role,sub=curSub(r);
 document.getElementById("side").innerHTML=sideHtml(r,sub);
 document.getElementById("top").innerHTML=topHtml(r,sub);
 document.body.classList.toggle("col",!!S.ui.col);
 document.body.classList.toggle("drawer",!!S.ui.drawer);
 VO=sub==="all";
 document.getElementById("app").innerHTML=`<div class="page"><div class="protonote"><b>Workflow demonstration.</b> Fictional schools, made-up numbers, simulated people. It shows that the workflow can run. It does not show how often such gaps occur, or that Nivaaran closes them. Deadlines and limits are placeholders that the department would set.</div>${pageHtml(r,sub)}</div><footer class="foot">${ic("shield","sm")}<span>Practice version with made-up schools and people. No girl’s name or personal data is ever collected. Photos show fixtures only, never people.</span></footer>`;
 VO=false;
 save()}

/* ---------- feedback: toasts & confirmations ---------- */
function toast(tn,title,msg){const box=document.getElementById("toasts"),el=document.createElement("div");
 el.className="toast "+tn;el.setAttribute("role",tn==="bad"?"alert":"status");
 el.innerHTML=`${ic({ok:"ok",bad:"xc",warn:"alert",info:"info"}[tn])}<div><b>${title}</b><p>${msg}</p></div><button aria-label="Dismiss">${ic("x","sm")}</button>`;
 el.querySelector("button").onclick=()=>el.remove();box.appendChild(el);while(box.children.length>3)box.firstChild.remove();
 setTimeout(()=>el.remove(),tn==="bad"?7000:4500)}
const isErr=m=>/^(Please|Enter|A supply gap is already|The next weekly|For each)/.test(m);
const OKM={rep:"Weekly check sent.",led:"Pad record saved.",supgap:"Missing supply reported to the block supply owner.",larep:"Marked as repair started.",obs:"Visit saved. Compare the answers below.",sc_ok:"Marked as fixed.",sc_no:"Not fixed. A follow-up task was created for the school.",sc_ct:"Noted. The other verifier checks it next.",rea:"Task reassigned.",expl:"Pad record updated.",evno:"Sent back to be fixed again.",no:"Sent back to be fixed again.",back:"Problem marked as back. The task reopened.",reopen:"Problem marked as back. The task reopened.",nextrep:"Moved to the next report day.",reset:"Demo restarted with the sample data.",newvisit:"New visit started.",fillr:"Example answers filled in. Check them, then submit.",fillo:"Example answers filled in. Check them, then save.",tick1:"Moved forward 1 day.",tick7:"Moved forward 7 days."};
function notify(a,escN,nq){
 if(S.flash){toast("bad","Not allowed",S.flash.replace(/^Not allowed: /,""));return}
 const errs=Object.values(S.err).filter(Boolean),bad=errs.find(isErr);
 if(bad){toast("bad","Please check",bad);return}
 if(S.msg){toast("ok","Done",S.msg);return}
 if(errs.length){const m=errs[0];toast(/safety|privacy/i.test(m)?"warn":"ok",a==="cfgsave"?"Rules saved":"Done",m);return}
 if(a==="off"){toast("info",S.off?"Offline mode":"Back online",S.off?"Actions are saved on this phone and sent later.":`You are online again.${nq?" Press Send to send waiting items.":""}`);return}
 if(a==="sync"){toast("ok","Sent",nq?`${nq} saved item${nq>1?"s were":" was"} sent.`:"Nothing was waiting.");return}
 let m=OKM[a];if(!m)return;
 if(["tick1","tick7","nextrep"].includes(a)){const n=S.log.filter(x=>x.k==="esc").length-escN;if(n>0){toast("warn","Time moved on",`${m} ${n} task update${n>1?"s":""}: deadlines passed and items moved up.`);return}}
 toast(a.startsWith("fill")?"info":"ok","Done",m)}
function run(a,i){const escN=S.log.filter(x=>x.k==="esc").length,nq=S.log.filter(x=>x.q).length;
 if(a==="tab"||a==="role")S.ui.drawer=false;
 act(a,i);notify(a,escN,nq);
 if(a==="tab"||a==="role")focusTop()}
function focusTop(){window.scrollTo(0,0);const h=document.querySelector("#app h1");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}}
const tk=i=>S.it.find(x=>x.id===i);
const CONF={
 reset:()=>({t:"Start the demo again?",m:"All changes in this demo will be lost and the sample data comes back.",ok:"Start over",d:1}),
 up:i=>{const t=tk(i);return {t:"Send this task up for help?",m:`It moves from the ${SH[t.owner].toLowerCase()} to the ${SH[t.chain[t.lvl+1]]?SH[t.chain[t.lvl+1]].toLowerCase():"next level"}. This is a request for help, not a punishment.`,ok:"Send up"}},
 rea:()=>({t:"Reassign this task?",m:"It goes to the person who handles this kind of work in your block.",ok:"Reassign"}),
 reopen:()=>({t:"Is the problem back?",m:"The task reopens and goes back to the school. Its history is kept.",ok:"Yes, reopen",d:1}),
 back:()=>({t:"Is the problem back?",m:"The task reopens and goes back to the school. Its history is kept.",ok:"Yes, reopen",d:1}),
 evno:()=>({t:"Send back to be fixed?",m:"The evidence is not enough. The task goes back to the school.",ok:"Send back",d:1}),
 no:()=>({t:"Not fixed?",m:"The task goes back to the person who must fix it.",ok:"Send back",d:1}),
 sc_no:()=>({t:"Mark as not fixed?",m:"A follow-up task is created for the school, and a verifier must check it again.",ok:"Not fixed",d:1}),
 supgap:()=>({t:"Report missing supply?",m:"A task is sent to the block supply owner. The school is not blamed.",ok:"Report it"}),
 cfgsave:()=>({t:"Save the new rules?",m:"New numbers apply to new tasks and to the coming days.",ok:"Save rules"})};
let lastFocus=null;
function confirmBox(c,yes){const m=document.getElementById("modal");lastFocus=document.activeElement;
 m.innerHTML=`<div class="modal"><div class="dlg${c.d?" danger":""}" role="dialog" aria-modal="true" aria-labelledby="dlgt" aria-describedby="dlgm"><h3 id="dlgt">${ic(c.d?"alert":"info")}${c.t}</h3><p id="dlgm">${c.m}</p><div class="acts"><button class="btn sec" id="dlgno">Cancel</button><button class="btn ${c.d?"dangerf":"pri"}" id="dlgyes">${c.ok}</button></div></div></div>`;
 const close=()=>{m.innerHTML="";if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus()};
 m.querySelector(".modal").addEventListener("click",e=>{if(e.target.classList.contains("modal"))close()});
 document.getElementById("dlgno").onclick=close;
 document.getElementById("dlgyes").onclick=()=>{m.innerHTML="";yes()};
 document.getElementById("dlgyes").focus()}

/* ---------- events ---------- */
function uiAct(u,d){
 if(u==="openside"){S.ui.drawer=true;render();const f=document.getElementById("rolesel");if(f)f.focus();return}
 if(u==="closeside"){S.ui.drawer=false;render();return}
 if(u==="collapse"){S.ui.col=!S.ui.col;render();return}
 if(u==="go"){grab();if(d.school&&d.school!==S.school){S.school=d.school;clearDr()}S.ui.sub[S.role]=d.page;S.ui.drawer=false;S.err={};render();focusTop()}}
document.addEventListener("click",e=>{
 const u=e.target.closest("[data-ui]");if(u){uiAct(u.dataset.ui,u.dataset);return}
 const b=e.target.closest("[data-a]");if(!b||b.disabled)return;
 const a=b.dataset.a,i=b.dataset.i;
 if(CONF[a]){confirmBox(CONF[a](i),()=>run(a,i));return}
 run(a,i)});
document.addEventListener("change",e=>{const f=e.target;if(!f)return;
 if(f.type==="file"&&f.files&&f.files[0]){const id=f.id.slice(3),file=f.files[0];
  if(!/^image\//.test(file.type)){toast("bad","Not a photo","Please choose a photo (JPG or PNG).");f.value="";return}
  grab();S.ui.loading=id;render();processPhoto(id,file);
  setTimeout(()=>{if(S.ui.loading===id&&!S.dr["photo_"+id]){S.ui.loading=null;render();toast("bad","Photo could not be read","Please try a JPG or PNG photo.")}},8000);return}
 if(f.id==="ctxs"){grab();S.school=f.value;clearDr();S.err={};render()}
 else if(f.id==="ctxb"){S.block=+f.value;render()}
 else if(f.id==="rolesel")run("role",f.value)});
document.addEventListener("input",e=>{if(/^(r|o)_p$/.test(e.target.id))updProg()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;
 const m=document.getElementById("modal");if(m.innerHTML){m.innerHTML="";if(lastFocus)lastFocus.focus();return}
 if(S.ui.drawer){S.ui.drawer=false;render()}});
S=load();S.ui.drawer=false;S.ui.loading=null;S.flash="";S.msg="";
render();
</script>
